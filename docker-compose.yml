name: nexorithm
x-app-env: &app-env
  NODE_ENV: development
  USE_DB: "true"
  MONGODB_URI: mongodb://mongodb:27017/nexorithm
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
services:
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports: ["127.0.0.1:${FRONTEND_BIND:-8080}:8080"]
    volumes: ["./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend-api]
    restart: unless-stopped
    mem_limit: 128m
  backend-api:
    build: {context: ./Backend, target: production}
    environment:
      <<: *app-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  judge-worker:
    build: {context: ./Backend, target: worker}
    environment:
      <<: *app-env
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runsc}
      ALLOW_WEAK_SANDBOX: ${ALLOW_WEAK_SANDBOX:-false}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-5000}
      EXECUTION_MEMORY_MB: ${EXECUTION_MEMORY_MB:-256}
      EXECUTION_CPUS: ${EXECUTION_CPUS:-1}
      EXECUTION_MAX_OUTPUT: ${EXECUTION_MAX_OUTPUT:-1048576}
      EXECUTION_PIDS: ${EXECUTION_PIDS:-32}
      MAX_PENDING_SUBMISSIONS: ${MAX_PENDING_SUBMISSIONS:-1000}
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.10-slim-bookworm}
      JAVASCRIPT_IMAGE: ${JAVASCRIPT_IMAGE:-node:22.15.0-bookworm-slim}
    # Trusted controller only. No runtime socket is ever given to API or sandboxes.
    volumes: ["${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"]
    group_add: ["${DOCKER_GID:-999}"]
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 120s
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  sandbox-reaper:
    build: {context: ./Backend, target: worker}
    command: ["node", "dist/queue/reaper.js"]
    environment:
      <<: *app-env
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runsc}
      ALLOW_WEAK_SANDBOX: ${ALLOW_WEAK_SANDBOX:-false}
    volumes: ["${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"]
    group_add: ["${DOCKER_GID:-999}"]
    depends_on:
      mongodb: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9092/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:8.0.9
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 15s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
  redis:
    image: redis:7.4.3-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.3.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/metrics-token:/etc/prometheus/metrics-token:ro
    depends_on: [backend-api, judge-worker, sandbox-reaper]
    mem_limit: 256m
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:${GRAFANA_BIND:-3000}:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    mem_limit: 256m
    restart: unless-stopped
volumes:
  mongo-data:
  redis-data:
