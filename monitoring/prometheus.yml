global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['backend-api:8000']
  - job_name: worker
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['judge-worker:9091']
  - job_name: reaper
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['sandbox-reaper:9092']
